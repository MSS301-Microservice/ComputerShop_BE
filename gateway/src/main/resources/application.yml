server:
  port: 8888

spring:
  application:
    name: computershop-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
          routes:
            # Giai đoạn 2: domain Identity/Auth đã tách sang user-service.
            # Route cụ thể hơn (order nhỏ hơn) được match trước route
            # catch-all bên dưới. Chú ý: /api/v1/internal/** (service-to-service,
            # bảo vệ bằng X-Internal-Api-Key) KHÔNG được route ở đây — nó sẽ rơi
            # vào catch-all và 404 ở monolith, tức là không lộ ra ngoài qua Gateway.
            - id: user-service
              uri: http://localhost:8081
              order: 10
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/otp-verification/**,/api/v1/forgot-password/**

            # Giai đoạn 3: domain Catalog (Product/Brand/Category/Attribute) đã
            # tách sang catalog-service.
            - id: catalog-service
              uri: http://localhost:8082
              order: 20
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/brands,/api/v1/brands/**,/api/v1/categories,/api/v1/categories/**,/api/v1/attributes,/api/v1/attributes/**

            # Giai đoạn 4: domain Cart đã tách sang cart-service.
            - id: cart-service
              uri: http://localhost:8083
              order: 30
              predicates:
                - Path=/api/v1/cart,/api/v1/cart/**

            # Giai đoạn 4: domain PC Builder đã tách sang pcbuilder-service.
            - id: pcbuilder-service
              uri: http://localhost:8084
              order: 40
              predicates:
                - Path=/api/v1/pc-builds,/api/v1/pc-builds/**

            # Giai đoạn 5: domain Order đã tách sang order-service, NHƯNG
            # Payment/Installment vẫn ở monolith và mount tại /orders/payment/**
            # (subpath của /orders/**) — route riêng này PHẢI có order nhỏ hơn
            # (ưu tiên cao hơn) route order-service bên dưới, nếu không Gateway
            # sẽ match nhầm /orders/payment/** sang order-service.
            - id: payment-monolith
              uri: http://localhost:8080
              order: 45
              predicates:
                - Path=/api/v1/orders/payment/**

            - id: order-service
              uri: http://localhost:8085
              order: 50
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**

            # Toàn bộ domain còn lại vẫn ở monolith hiện tại.
            # /api/v1/ws là endpoint SockJS/STOMP cho chat — nằm trong cùng
            # prefix /api/v1/** nên dùng chung route này; Spring Cloud Gateway
            # tự nâng cấp WebSocket (Upgrade header) trên route http:// mà
            # không cần khai báo uri: ws:// riêng.
            #
            # Khi tách từng service tiếp theo, chỉ cần thêm 1 route mới có path
            # cụ thể hơn (order nhỏ hơn 100) để "bóc" domain đó ra khỏi monolith.
            - id: monolith-catch-all
              uri: http://localhost:8080
              order: 100
              predicates:
                - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{correlationId}] %-5level %logger{36} - %msg%n"
