spring:
  application:
    name: computershop-pcbuild-service
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=ComputerShopPCBuildDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        use_nationalized_character_data: true

server:
  port: 8084
  servlet:
    context-path: /api/v1

jwt:
  signer-key: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION}

internal:
  api-key: ${INTERNAL_API_KEY}

services:
  catalog-service:
    base-url: http://localhost:8082/api/v1
  order-service:
    base-url: http://localhost:8085/api/v1
  monolith:
    base-url: http://localhost:8080/api/v1
