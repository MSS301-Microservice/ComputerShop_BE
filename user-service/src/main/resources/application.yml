spring:
  application:
    name: computershop-user-service
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=ComputerShopUserDB;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        use_nationalized_character_data: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081
  servlet:
    context-path: /api/v1

jwt:
  # Phải giống hệt giá trị bên ComputerShop_BE (monolith remnant) để JWT phát ra
  # từ đây được các service khác verify chữ ký thành công.
  signer-key: ${JWT_SIGNER_KEY}
  valid-duration: ${JWT_VALID_DURATION}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION}

internal:
  # Shared secret cho endpoint /internal/users/** (monolith remnant gọi sang) —
  # không phải JWT khách hàng. Phải giống hệt ComputerShop_BE/.env.
  api-key: ${INTERNAL_API_KEY}
